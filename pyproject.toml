[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "social-sentinel"
version = "0.1.0"
description = "X-first social-media analytics vertical slice"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "networkx>=3.4,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "requests>=2.32,<3",
  "langdetect>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "telethon>=1.40,<2",
  "torch>=2.6,<3",
  "transformers>=4.48,<5",
  "tweepy>=4.15,<5",
  "google-api-python-client>=2.150,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
trend = ["bertrend>=0.3,<1"]
dev = [
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=6,<7",
  "ruff>=0.16,<1",
]

[project.scripts]
social-sentinel-api = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires local PostgreSQL",
  "live: requires external credentials/network access",
  "model: downloads and executes transformer checkpoints",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE", "DTZ", "UP", "FURB"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
"app/scheduler/jobs.py" = ["BLE001"]
"app/scheduler/service.py" = ["BLE001"]
"app/platforms/telegram/stream.py" = ["BLE001"]
"scripts/*.py" = ["BLE001"]
"tests/conftest.py" = ["BLE001"]
"tests/unit/test_event_schema.py" = ["DTZ001"]
"tests/unit/test_trend_batching.py" = ["DTZ001"]
